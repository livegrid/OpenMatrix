; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = https://github.com/Jason2866/platform-espressif32.git#Arduino/IDF5
platform_packages = tool-xtensa-esp-elf-gdb
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.partitions = partitions_custom.csv
build_flags =
	-I include
	-DBOARD_HAS_PSRAM
	-DUSE_GFX_LITE
	-DCORE_DEBUG_LEVEL=5
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=3072
	-DCONFIG_ESP_MAIN_TASK_STACK_SIZE=3072
	; WiFi buffer configuration - reduce to minimum for RAM-constrained builds
	-DCONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
	-DCONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
	-DCONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=8
	-DCONFIG_ESP32_WIFI_TX_BUFFER_TYPE=1
	-DCONFIG_ESP32_WIFI_CACHE_TX_BUFFER_NUM=8
framework = arduino
upload_speed = 921600
lib_compat_mode = soft
lib_deps = 
	Wire
	SPI
	FS
	https://github.com/drvkmr/ESP32-HUB75-MatrixPanel-DMA.git#fix-gdma-esp-idf-5.1-compat
	ayushsharma82/ElegantOTA@^3.1.5
	ayushsharma82/NetWizard@^1.1.1
	bblanchon/ArduinoJson@^7.1.0
	https://github.com/drvkmr/async-mqtt-client
	https://github.com/drvkmr/ESPAsyncE131/
	https://github.com/drvkmr/GFX_Lite
	https://github.com/robjen/GFX_fonts
	bitbank2/AnimatedGIF @ 2.1.1
	sensirion/Sensirion I2C SCD4x@^0.4.0
	starmbi/hp_BH1750@^1.0.2
	adafruit/Adafruit ADXL345@^1.3.4
	stm32duino/STM32duino VL53L8CX@^2.0.3
